name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Android APK
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: '3.11'
          bundled-python-version: '3.11'
